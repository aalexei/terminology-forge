[project]
name = "terminology-forge"
version = "0.1.0"
description = "Terminology development"
readme = { file = "README.org", content-type = "text/plain" }
authors = [
    { name = "Alexei Gilchrist", email = "alexei@entropy.energy" }
]
requires-python = ">=3.12"
dependencies = [
  "python-arango",
  "python-arango-async",
  "fastapi[standard]",
  "loguru",
  "dotenv",
  "pydantic-settings",
  "uvicorn",
  "asyncio",
  "beautifulsoup4",
  "arango",
  "itsdangerous",
  "bcrypt",
  "openpyxl",
]

[project.scripts]
tf = "app.main:main"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
